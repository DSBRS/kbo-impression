<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>야구선수 첫인상 표</title>
<style>
:root{--bg:#fadce7;--card:#fff;--ink:#2b2b3a;--sub:#7a7a8c;--accent:#e5649a;--line:color-mix(in srgb,var(--accent) 28%,#fff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 80px}
.head{text-align:center;margin-bottom:16px}
.head h1{margin:0;font-size:28px;font-weight:700;color:var(--accent)}
.head .s{color:var(--sub);font-size:18px;margin-top:2px}
.hint{text-align:center;color:var(--sub);font-size:13px;margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
button{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:active{transform:scale(.97)}
.back{margin-bottom:6px;padding:6px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.pick{padding:18px 12px;font-size:17px;text-align:center}
.pick small{display:block;color:var(--sub);font-weight:400;font-size:12px;margin-top:4px}
.r,.hd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hd div{text-align:center;font-size:20px;font-weight:600}
.cell{position:relative;min-width:0}
.photo{display:block;width:100%;aspect-ratio:10/11;padding:0;border-radius:12px;background:var(--card);border:1px dashed var(--line);color:var(--sub);font-size:12px;overflow:hidden;cursor:default}
.photo.edit{cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.box{background:#fff;color:#2b2b3a;border-radius:10px;margin-top:6px;padding:6px 8px;border:1px solid var(--line)}
.box input,.box textarea,.box .nm{display:block;width:100%;border:0;background:transparent;color:#111;font:inherit;font-size:14px;padding:2px 0}
.box input,.box .nm{font-weight:700}
.box .nm,.box textarea+*{border-bottom:0}
.box textarea{resize:none;min-height:64px}
.box input:focus,.box textarea:focus{outline:none}
.box ::placeholder{color:#aaa;font-weight:400}
.cap input{font-weight:400;font-size:13px}
.res{font-size:13px;font-weight:700;padding:2px 0}
.ok{color:#1a8f4a}.no{color:#c8312b}
.nm2{text-align:center;font-size:13px;margin-top:3px}
.del{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);border:0;font-size:12px;line-height:1;color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:48px 12px;border:1px dashed var(--line);border-radius:12px}
.status{text-align:center;font-size:12px;color:var(--sub);margin-top:14px;min-height:18px}
.owner{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:18px}
.owner .ot{font-size:13px;color:var(--sub);text-align:center;margin:0 0 10px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.head h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"></div>
  <div id="ownerBox"></div>
  <p class="hint" id="hint"></p>
  <div class="bar" id="actions">
    <button class="primary" id="save">💾 이미지로 저장</button>
    <button id="check">정답 확인</button>
    <button id="clearNotes">내 글 지우기</button>
  </div>
  <div id="list"></div>
  <div class="status" id="status"></div>
</div>

  var TEAMS=[['doosan','두산 베어스','#1d2a6b','#e6e8f6'],['lg','LG 트윈스','#c30452','#fbe1ec'],['kia','KIA 타이거즈','#ea0029','#fde1e4'],['samsung','삼성 라이온즈','#0a58c2','#dfeafb'],['lotte','롯데 자이언츠','#d00f31','#e1e7f3'],['ssg','SSG 랜더스','#ce0e2d','#fff1d6'],['nc','NC 다이노스','#315288','#e6ecf6'],['kt','KT 위즈','#eb1c24','#eeeeee'],['hanwha','한화 이글스','#f26a1b','#ffe9d9'],['kiwoom','키움 히어로즈','#8e1235','#f6e1e6']];
  function team(k){return TEAMS.filter(function(x){return x[0]===k})[0]}
  function applyTheme(){var t=team(cur),s=document.documentElement.style;if(t){s.setProperty('--bg',t[3]);s.setProperty('--accent',t[2])}else{s.removeProperty('--bg');s.removeProperty('--accent')}}
  var MODES=[['guess','이름 맞추기','사진만 보고 이름을 맞혀요'],['first','첫인상표','첫인상을 글로 적어요'],['now','현인상표','지금 인상을 글로 적어요'],['both','첫-현인상표','첫인상·현인상 이미지를 나란히 올려요']];
  var HINTS={guess:'사진을 보고 선수 이름을 맞춰보세요!',first:'사진을 보고 느낀 첫인상을 적어보세요.',now:'지금 생각하는 현인상을 적어보세요.',both:'칸을 눌러 첫인상·현인상 이미지를 올리고, 한마디도 적어보세요.'};
  function nm(L,k){for(var i=0;i<L.length;i++)if(L[i][0]===k)return L[i][1];return ''}
  var tn=function(k){return nm(TEAMS,k)},mn=function(k){return nm(MODES,k)};
  var seed={teams:{}};try{seed=JSON.parse($('seed').textContent)||seed}catch(e){}
  var data=JSON.parse(JSON.stringify(seed)),notes={},owner=false,artifact=null,mode='',cur='',shown=false;
  try{notes=JSON.parse(localStorage.getItem(NKEY)||'{}')||{}}catch(e){}

  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function route(){var h=location.hash.slice(1),i=h.indexOf('-'),m=i<0?h:h.slice(0,i),t=i<0?'':h.slice(i+1);mode=mn(m)?m:'';cur=mode&&tn(t)?t:''}
  function go(h){location.hash=h}
  function saveNotes(){try{localStorage.setItem(NKEY,JSON.stringify(notes));st.textContent='자동 저장됨'}catch(e){st.textContent='저장 공간이 가득 찼어요. 이미지로 저장해 두세요.'}}
  var tm;function later(){clearTimeout(tm);tm=setTimeout(saveNotes,400)}
  function saveDraft(){try{localStorage.setItem(DKEY,JSON.stringify(data))}catch(e){st.textContent='브라우저 저장 공간이 가득 찼어요. 지금 「입력용 HTML 만들기」로 파일을 받아 두세요.'}}
  function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function curRows(){if(!data.teams)data.teams={};if(!data.teams[cur])data.teams[cur]={rows:[]};return data.teams[cur].rows}
  function count(k){var t=data.teams&&data.teams[k];return t&&t.rows?t.rows.length:0}
  function nv(id){return notes[mode+':'+id]}
  function sv(id,v){notes[mode+':'+id]=v;later()}
  function bv(id){var v=nv(id);return v&&typeof v==='object'?v:{}}
  function sb(id,k,v){var o=bv(id);o[k]=v;sv(id,o)}
  function norm(s){return String(s||'').replace(/\s+/g,'').toLowerCase()}
  function isOk(r){return !!r.name&&norm(nv(r.id))===norm(r.name)}

  function resize(file){
    return new Promise(function(res,rej){
      var fr=new FileReader();fr.onerror=rej;
      fr.onload=function(){var im=new Image();im.onerror=rej;
        im.onload=function(){var W=320,H=352,c=document.createElement('canvas');c.width=W;c.height=H;
          var x=c.getContext('2d'),r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
          x.drawImage(im,(W-w)/2,(H-h)*0.2,w,h);res(c.toDataURL('image/jpeg',.78))};
        im.src=fr.result};
      fr.readAsDataURL(file);
    });
  }
  function pick(cb,multi){var f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=!!multi;
    f.onchange=async function(){var fs=Array.prototype.slice.call(f.files);for(var i=0;i<fs.length;i++){try{cb(await resize(fs[i]),fs[i].name)}catch(e){}}if(multi){saveDraft();render()}};f.click()}

  function renderHead(){
    var h=$('head');h.textContent='';
    if(mode){var b=el('button','back','← '+(cur?'구단 선택':'처음으로'));b.onclick=function(){go(cur?mode:'')};h.appendChild(b)}
    h.appendChild(el('h1','',TITLE));
    var s=cur?tn(cur)+' · '+mn(mode):mode?mn(mode):'';
    if(s)h.appendChild(el('div','s',s));
  }

  var ALIAS={doosan:['두산','doosan','베어스','bears'],lg:['lg','엘지','트윈스'],kia:['kia','기아','타이거즈'],samsung:['삼성','samsung','라이온즈'],lotte:['롯데','lotte','자이언츠'],ssg:['ssg','랜더스'],nc:['nc','엔씨','다이노스'],kt:['kt','위즈'],hanwha:['한화','hanwha','이글스'],kiwoom:['키움','kiwoom','히어로즈']};
  function nameOf(n){return String(n||'').replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim()}
  function teamOf(segs){for(var s=segs.length-1;s>=0;s--){var g=segs[s].toLowerCase();for(var k in ALIAS){if(ALIAS[k].some(function(a){return /^[a-z]+$/.test(a)?g.indexOf(a)===0:g.indexOf(a)>=0}))return k}}return ''}
  function folderUpload(){
    var f=document.createElement('input');f.type='file';f.webkitdirectory=true;f.multiple=true;
    f.onchange=async function(){
      var fs=Array.prototype.slice.call(f.files).filter(function(x){return /^image\//.test(x.type)}),n=0,skip=0;
      for(var i=0;i<fs.length;i++){
        var key=teamOf((fs[i].webkitRelativePath||'').split('/').slice(0,-1))||cur;
        if(!key){skip++;continue}
        try{var d=await resize(fs[i]);if(!data.teams)data.teams={};if(!data.teams[key])data.teams[key]={rows:[]};
          data.teams[key].rows.push({id:uid(),photo:d,name:nameOf(fs[i].name)});n++;st.textContent=n+' / '+fs.length+'장 올리는 중…'}catch(e){skip++}
      }
      saveDraft();render();st.textContent=n+'장을 올렸어요.'+(skip?' ('+skip+'장은 건너뜀)':'');
    };f.click();
  }
  function renderOwner(){
    var b=$('ownerBox');b.textContent='';
    if(!owner)return;
    var w=el('div','owner');w.appendChild(el('p','ot','👑 관리자 페이지: 사진·이름을 정리한 뒤 「입력용 HTML 만들기」로 사람들에게 보낼 파일을 만드세요. (모든 구단·버전에 함께 적용 · 파일 이름이 선수 이름이 돼요)'));
    var bar=el('div','bar');bar.style.margin='0';w.appendChild(bar);
    function mk(t,c,fn){var x=el('button',c,t);x.onclick=fn;bar.appendChild(x)}
    mk('📷 사진 올리기 (여러 장)','',function(){pick(function(d,n){curRows().push({id:uid(),photo:d,name:nameOf(n)})},true)});
    mk('📁 폴더째로 한 번에 올리기','',folderUpload);
    mk('＋ 빈 칸','',function(){curRows().push({id:uid(),photo:'',name:''});saveDraft();render()});
    mk('📤 입력용 HTML 만들기','primary',exportViewer);
    mk('되돌리기','',function(){if(confirm('마지막으로 반영한 상태로 되돌릴까요?')){data=JSON.parse(JSON.stringify(seed));try{localStorage.removeItem(DKEY)}catch(e){}render()}});
    b.appendChild(w);
  }

  function photoCell(r,i){
    var cell=el('div','cell'),ph=el('button','photo'+(owner?' edit':''));ph.type='button';
    if(r.photo){var im=el('img');im.src=r.photo;im.alt='선수 사진';ph.appendChild(im)}else ph.textContent=owner?'사진 추가':'';
    if(owner){ph.onclick=function(){pick(function(d){r.photo=d;saveDraft();render()})};
      var d=el('button','del','✕');d.title='삭제';d.onclick=function(){curRows().splice(i,1);saveDraft();render()};cell.appendChild(ph);cell.appendChild(d)}
    else cell.appendChild(ph);
    return cell;
  }
  function ownerName(r){var n=el('input');n.type='text';n.placeholder=mode==='guess'?'정답 이름':'이름 (선택)';n.value=r.name||'';n.oninput=function(){r.name=n.value;saveDraft()};return n}

  function slot(r,k,ck){
    var c=el('div','cell'),b=el('button','photo edit'),u=bv(r.id)[k];b.type='button';
    if(u){var im=el('img');im.src=u;b.appendChild(im)}else b.textContent='+ 이미지';
    b.onclick=function(){pick(function(d){sb(r.id,k,d);render()})};c.appendChild(b);
    if(u){var x=el('button','del','✕');x.onclick=function(){sb(r.id,k,'');render()};c.appendChild(x)}
    var bx=el('div','box cap'),t=el('input');t.type='text';t.placeholder='한마디 (선택)';t.value=bv(r.id)[ck]||'';
    t.oninput=function(){sb(r.id,ck,t.value)};bx.appendChild(t);c.appendChild(bx);return c;
  }

  function render(){
    route();applyTheme();renderHead();
    var list=$('list');list.textContent='';list.className='';
    var hint=$('hint'),act=$('actions'),sc=0,tot=0;
    $('ownerBox').textContent='';
    if(!mode||!cur){
      act.style.display='none';hint.style.display='';hint.textContent=mode?'구단을 선택해 주세요.':'어떤 걸 해볼까요?';
      list.className='grid two';
      (mode?TEAMS:MODES).forEach(function(t){
        var b=el('button','pick',t[1]);if(mode)b.style.borderLeft='6px solid '+t[2];
        var s=el('small','',mode?(count(t[0])?count(t[0])+'명':'준비 중'):t[2]);b.appendChild(s);
        b.onclick=function(){go(mode?mode+'-'+t[0]:t[0])};list.appendChild(b);
      });
      return;
    }
    renderOwner();act.style.display='';
    $('check').style.display=mode==='guess'?'':'none';$('check').textContent=shown?'다시 풀기':'정답 확인';
    hint.textContent=HINTS[mode]+' 적은 내용은 내 기기에만 저장돼요.';
    var rows=curRows();hint.style.display=rows.length?'':'none';
    if(!rows.length){list.className='grid';var e=el('div','empty',owner?'「사진 올리기」로 선수 사진을 먼저 올려주세요!':'아직 사진이 올라오지 않았어요. 조금만 기다려 주세요!');list.appendChild(e);return}
    if(mode==='both'){
      var hd=el('div','hd');hd.appendChild(el('div'));hd.appendChild(el('div','','첫인상'));hd.appendChild(el('div','','현인상'));list.appendChild(hd);
      rows.forEach(function(r,i){
        var row=el('div','r'),c0=photoCell(r,i);
        if(owner){var bx=el('div','box');bx.appendChild(ownerName(r));c0.appendChild(bx)}else if(r.name)c0.appendChild(el('div','nm2',r.name));
        row.appendChild(c0);row.appendChild(slot(r,'a','ca'));row.appendChild(slot(r,'b','cb'));list.appendChild(row);
      });
      return;
    }
    list.className='grid';
    rows.forEach(function(r,i){
      var cell=photoCell(r,i),box=el('div','box');
      if(owner)box.appendChild(ownerName(r));else if(mode!=='guess'&&r.name)box.appendChild(el('div','nm',r.name));
      if(mode==='guess'){
        var t=el('input');t.type='text';t.placeholder='이름은?';t.value=nv(r.id)||'';t.oninput=function(){sv(r.id,t.value)};box.appendChild(t);
        if(r.name)tot++;
        if(shown){var ok=isOk(r);if(ok)sc++;box.appendChild(el('div','res '+(ok?'ok':'no'),ok?'✅ 정답!':(r.name?'❌ 정답: '+r.name:'정답 미등록')))}
      }else{
        var ta=el('textarea');ta.placeholder=(mode==='first'?'첫인상':'현인상')+'을 적어보세요';ta.value=nv(r.id)||'';ta.oninput=function(){sv(r.id,ta.value)};box.appendChild(ta);
      }
      cell.appendChild(box);list.appendChild(cell);
    });
    if(mode==='guess'&&shown)st.textContent='점수: '+sc+' / '+tot;
  }

  function download(name,blob){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
  async function saveFile(name,blob){
    var dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
    if(dl)await dl.save({filename:name,data:blob});else download(name,blob);
  }
  async function exportViewer(){
    var json=JSON.stringify(data).replace(/</g,'\\u003c');
    var html=BASE.replace(/(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+json+b}).replace('var ADMIN=true;','var ADMIN=false;').replace(' (관리자)</title>','</title>');
    try{await saveFile('viewer.html',new Blob([html],{type:'text/html'}));st.textContent='입력용 HTML을 만들었어요.'}catch(e){st.textContent='만들지 못했어요. 다시 시도해 주세요.'}
  }

  $('check').onclick=function(){shown=!shown;st.textContent='';render()};
  $('clearNotes').onclick=function(){
    if(confirm('이 화면에서 내가 쓴 내용을 모두 지울까요?')){curRows().forEach(function(r){delete notes[mode+':'+r.id]});saveNotes();render()}
  };

  function wrap(ctx,text,maxW){
    var L=[];String(text).split('\n').forEach(function(p){var c='';
      for(var i=0;i<p.length;i++){var s=c+p[i];if(ctx.measureText(s).width>maxW&&c){L.push(c);c=p[i]}else c=s}L.push(c)});
    return L;
  }
  function li(src){return new Promise(function(res){if(!src)return res(null);var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}

  async function exportPng(){
    var rows=curRows(),both=mode==='both',W=1080,m=40,gap=both?16:24,cw=Math.floor((W-m*2-gap*2)/3),ph=Math.round(cw*1.1);
    var font='"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif',lh=30,pad=14,headH=both?270:210;
    var c=document.createElement('canvas'),ctx=c.getContext('2d');ctx.font='24px '+font;
    var imgs=[],CL=[],RH=[],cols=both?1:3,nrows=Math.ceil(rows.length/cols),i,k,r;
    for(i=0;i<rows.length;i++){var b0=both?bv(rows[i].id):{};imgs.push([await li(rows[i].photo),await li(b0.a),await li(b0.b)])}
    for(r=0;r<nrows;r++){
      var mx=0,ex=0;
      for(k=0;k<cols;k++){
        var idx=r*cols+k,it=rows[idx];if(!it)continue;
        if(both){var bb=bv(it.id);var cp=[it.name||'',bb.ca||'',bb.cb||''].map(function(t){return t?wrap(ctx,t,cw):[]});CL[idx]=cp;cp.forEach(function(a){ex=Math.max(ex,a.length)})}
        else{
          var o=[],v=nv(it.id)||'';
          if(mode==='guess'){o.push({t:v||'(미입력)',b:1});if(shown){var ok=isOk(it);o.push({t:ok?'정답!':(it.name?'정답: '+it.name:'정답 미등록'),c:ok?'#1a8f4a':'#c8312b',b:1})}}
          else{if(it.name)o.push({t:it.name,b:1});wrap(ctx,v,cw-pad*2).forEach(function(l){o.push({t:l})})}
          CL[idx]=o;mx=Math.max(mx,pad*2+Math.max(2,o.length)*lh);
        }
      }
      RH.push(both?ph+(ex?ex*lh+12:0):ph+4+mx);
    }
    var total=headH+RH.reduce(function(a,b){return a+b+gap+16},0)+m;
    c.width=W;c.height=Math.max(1920,total);ctx=c.getContext('2d');
    var T=team(cur);ctx.fillStyle=T[3];ctx.fillRect(0,0,W,c.height);
    ctx.fillStyle=T[2];ctx.fillRect(0,150,W,10);
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillStyle=T[2];ctx.font='700 64px '+font;ctx.fillText(TITLE,W/2,100);
    ctx.fillStyle='#5b5b6d';ctx.font='500 38px '+font;ctx.fillText(tn(cur)+' · '+mn(mode),W/2,142);
    function draw(img,x,y){ctx.fillStyle='#ffffff';ctx.beginPath();ctx.roundRect(x,y,cw,ph,10);ctx.fill();
      if(img){ctx.save();ctx.beginPath();ctx.roundRect(x,y,cw,ph,10);ctx.clip();ctx.drawImage(img,x,y,cw,ph);ctx.restore()}}
    if(both){ctx.fillStyle=T[2];ctx.font='700 44px '+font;ctx.fillText('첫인상',m+cw+gap+cw/2,headH-34);ctx.fillText('현인상',m+2*(cw+gap)+cw/2,headH-34)}
    var y=headH;
    for(r=0;r<nrows;r++){
      for(k=0;k<cols;k++){
        var ix=r*cols+k;if(!rows[ix])continue;
        if(both){
          for(var j=0;j<3;j++){var x0=m+j*(cw+gap);draw(imgs[ix][j],x0,y);
            ctx.fillStyle='#2b2b3a';ctx.font='24px '+font;ctx.textAlign='center';
            CL[ix][j].forEach(function(l,q){ctx.fillText(l,x0+cw/2,y+ph+28+q*lh)})}
        }else{
          var x=m+k*(cw+gap);draw(imgs[ix][0],x,y);
          ctx.fillStyle='#fff';ctx.fillRect(x,y+ph+4,cw,RH[r]-ph-4);ctx.textAlign='left';
          CL[ix].forEach(function(l,q){ctx.fillStyle=l.c||'#111';ctx.font=(l.b?'bold ':'')+'24px '+font;ctx.fillText(l.t,x+pad,y+ph+4+pad+22+q*lh)});
        }
      }
      y+=RH[r]+gap+16;
    }
    return new Promise(function(res){c.toBlob(res,'image/png')});
  }

  $('save').onclick=async function(){
    if(!curRows().length){st.textContent='저장할 사진이 아직 없어요.';return}
    st.textContent='이미지를 만드는 중…';
    try{
      var blob=await exportPng();await saveFile(TITLE+' - '+tn(cur)+' '+mn(mode)+'.png',blob);
      st.textContent='저장했어요!';
    }catch(e){st.textContent=(e&&e.code==='declined')?'저장을 취소했어요.':'저장하지 못했어요. 다시 시도해 주세요.'}
  };

  window.addEventListener('hashchange',function(){shown=false;st.textContent='';render()});
  owner=ADMIN;
  if(owner){try{var d=JSON.parse(localStorage.getItem(DKEY)||'null');if(d&&d.teams)data=d}catch(e){}}
  render();
  })();
</script></body></html>
